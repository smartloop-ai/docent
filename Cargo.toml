[package]
name = "docent"
version = "1.0.63"
edition = "2024"
build = "build.rs"

[[bin]]
name = "docent"
path = "src/main.rs"

[features]
default = []
# GPU backends for the embedded agent's llama.cpp, passed through to the
# smartloop crate: Metal on macOS, Vulkan on Linux and Windows.
metal = ["smartloop/metal"]
vulkan = ["smartloop/vulkan"]
cuda = ["smartloop/cuda"]

[dependencies]
# The SLP framework, run in-process as the local agent, from Smartloop's
# registry at dl.smartloop.ai (declared in .cargo/config.toml).
smartloop = { version = "1.2.27", registry = "smartloop" }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
prettytable-rs = "^0.10"
async-openai = { version = "0.42.0", features = ["byot", "chat-completion"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.34"
rpassword = "7"
indicatif = "0.18.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = { version = "3.6.1", default-features = false }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
anyhow = "1"
ignore = "0.4.33"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
serde = { version = "1", features = ["derive"] }
tui-markdown = "0.3.12"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# To end a shell command's whole process group on /stop, and on quitting.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# mupdf's system-font lookup (via font-kit) links libfontconfig.so.1, which
# minimal Linux images (cloud VMs, containers) lack -- and without it the
# binary fails to start at all. Turn on fontconfig's dlopen mode so it loads
# at runtime instead: when absent, mupdf's font callback catches the failure
# and falls back to its built-in fonts. Only here to enable the feature (it
# must be font-kit's: it switches font-kit's calls to the dlopened table).
[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14", default-features = false, features = ["source-fontconfig-dlopen"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
