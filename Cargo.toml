[package]
name = "smartloop-cli"
version = "1.0.36"
edition = "2024"
build = "build.rs"

[[bin]]
name = "smartloop"
path = "src/main.rs"

[features]
default = []
# GPU backends for the embedded agent's llama.cpp, passed through to the
# smartloop crate: Metal on macOS, Vulkan on Linux and Windows.
metal = ["smartloop/metal"]
vulkan = ["smartloop/vulkan"]
cuda = ["smartloop/cuda"]

[dependencies]
# The SLP framework, run in-process as the local agent, from Smartloop's
# registry at dl.smartloop.ai (declared in .cargo/config.toml).
smartloop = { version = "1.2.9", registry = "smartloop" }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
prettytable-rs = "^0.10"
async-openai = { version = "0.42.0", features = ["byot", "chat-completion"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.34"
rpassword = "7"
indicatif = "0.18.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = { version = "3.6.1", default-features = false }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
